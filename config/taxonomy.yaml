# AI Project Intelligence Library taxonomy.
# Versioned, multi-label, extensible. Each term: slug -> {label, synonyms?, parent?, ...attributes}.
# Extractors must use these slugs; unknown terms are logged to the review queue as proposals
# (prefix "new:") instead of being silently forced into an ill-fitting category.
version: "1.2.0"
# 1.2.0: consolidation of provisional terms proposed during full extraction (aliases section).
# 1.1.0: pilot-driven additions (custom labeling, feature selection, threshold tuning, grouped split,
#        optuna/monai/fairlearn/catboost tools, CNN-RNN hybrids, international development).

