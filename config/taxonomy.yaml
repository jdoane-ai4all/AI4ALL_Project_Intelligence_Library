      pca: {label: Principal component analysis, family: dimensionality_reduction, level: 2}
      tsne_umap: {label: t-SNE / UMAP, family: dimensionality_reduction, level: 2}
      mlp: {label: Multilayer perceptron / feed-forward NN, family: neural, level: 2, synonyms: [neural network, ann, dense network]}
